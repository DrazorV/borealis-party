[package]
name = "party-encounter"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Stat block copies, per-encounter overrides and the player view of encounter creatures for Borealis Party"

[lints]
workspace = true

[dependencies]
# The stat block model a snapshot is checked against (`overrides`).
borealis-content = { path = "../../../crates/borealis-content" }
# The combat engine's combatant a copy builds (`combatant`).
party-combat = { path = "../party-combat" }
# The canonical-spell resolver monster spellbooks link through (`spellbook::link`).
party-spells = { path = "../party-spells" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

