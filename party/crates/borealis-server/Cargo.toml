[package]
name = "borealis-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Multi-user Borealis server: accounts, each with its own characters and content"

[[bin]]
name = "borealis-server"
path = "src/main.rs"

[dependencies]
# Upstream's `mas` feature is the one that compiles the AI CLIs and the self-updater out; on Linux it adds nothing else.
# `device-link` brings the .borealis bundle code (open, preview, accept). Only those commands are offered, so the
# device-to-device transfer it also compiles in stays unreachable (see `backend.rs`).
borealis = { path = "../../../src-tauri", default-features = false, features = ["mas", "device-link"] }
tauri = { path = "../tauri" }
# Sync for the apps: the same digests, edit stamps and trash as upstream's bundles, and its content file format.
borealis-bundle = { path = "../../../crates/borealis-bundle" }
borealis-content = { path = "../../../crates/borealis-content" }
# A pushed character replaces an open session's character in place (sync.rs).
borealis-character = { path = "../../../crates/borealis-character" }
# The bestiary reads the creature details upstream's 5etools import drops from the same data (bestiary.rs).
borealis-import-5etools = { path = "../../../crates/borealis-import-5etools" }
# Encounter maths, stat block copies and overrides (encounters.rs).
party-encounter = { path = "../party-encounter" }
# The combat engine (combat.rs): pure state, commands and the seeded die.
party-combat = { path = "../party-combat" }
# The AI tool registry, the dry-run simulator and the MCP envelope (mcp.rs, tools_backend.rs).
party-tools = { path = "../party-tools" }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "fs", "set-header"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "any", "sqlite", "postgres", "tls-rustls-ring-webpki"] }
toml = "0.9"
url = "2"
argon2 = "0.5"
sha2 = "0.10"
rand = "0.9"
uuid = { version = "1", features = ["v4", "v7"] }
base64 = "0.22"
# Sign-up email; rustls with ring and the webpki roots, like sqlx.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "pool", "hostname", "tokio1-rustls", "ring", "webpki-roots"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
