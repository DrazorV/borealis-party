[package]
name = "party-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Encounter simulation for Borealis Connect: a pure runner on a copy of an encounter, driven by oracles (no I/O)"

[lints]
workspace = true

[dependencies]
# The stat block model a creature's actions are read from.
borealis-content = { path = "../../../crates/borealis-content" }
# Every number: the combat engine and its dice.
party-combat = { path = "../party-combat" }
# The encounter copies and the shared creature builder.
party-encounter = { path = "../party-encounter" }
# The curated SRD spell mechanics and the one-spell-per-name resolver.
party-spells = { path = "../party-spells" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
