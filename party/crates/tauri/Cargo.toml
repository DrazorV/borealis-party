[package]
name = "tauri"
version = "2.99.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The slice of the tauri API the Borealis backend uses, with no webview: one AppHandle per server workspace"

[features]
default = ["wry", "compression"]
wry = []
compression = []
common-controls-v6 = []
test = []
rustls-tls = []
protocol-asset = []
tray-icon = []
image-png = []
image-ico = []
macos-private-api = []
unstable = []
x11 = []
webview-data-url = []
native-tls = []
dynamic-acl = []

[dependencies]
tauri-macros = { path = "../tauri-macros" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
url = "2"
