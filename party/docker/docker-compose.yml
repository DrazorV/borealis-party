# Borealis Connect with SQLite: everything lives in the mounted /config folder.
# On first start the server writes /config/config.toml with every setting explained.
# Any setting can be set here instead, as BOREALIS__<SECTION>__<KEY>.
# Stacks set up before the rename to Borealis Connect keep their "borealis-party" service and container names; the host
# folders, the database name and the BOREALIS__* variables stay as they are on every install.
services:
  borealis-connect:
    container_name: "borealis-connect"
    image: "ghcr.io/fortress-soft/borealis-connect:latest"
    # Or build it yourself from a checkout of the repository:
    # build:
    #   context: "../.."
    #   dockerfile: "party/docker/Dockerfile"
    environment:
      - "TZ=Europe/Athens"
      - "PUID=1026"
      - "PGID=65540"
      # - "BOREALIS__SERVER__OPEN_REGISTRATION=false"
      # - "BOREALIS__INITIAL_ADMIN__USERNAME=admin"
      # - "BOREALIS__INITIAL_ADMIN__PASSWORD=change-me"
      # Sign-up email (optional):
      # - "BOREALIS__SERVER__PUBLIC_URL=https://party.example.com"
      # - "BOREALIS__SMTP__HOST=smtp.example.com"
      # - "BOREALIS__SMTP__USER=party@example.com"
      # - "BOREALIS__SMTP__PASSWORD=change-me"
      # - "BOREALIS__SMTP__FROM=Borealis Connect <party@example.com>"
      # PostgreSQL instead of SQLite:
      # - "BOREALIS__DATABASE__TYPE=postgres"
      # - "BOREALIS__POSTGRES__HOST=172.20.20.247"
      # - "BOREALIS__POSTGRES__PORT=5432"
      # - "BOREALIS__POSTGRES__USER=borealis_user"
      # - "BOREALIS__POSTGRES__PASSWORD=change-me"
      # - "BOREALIS__POSTGRES__DATABASE=borealis_party"
    network_mode: "bridge"
    ports:
      - "8787:8787/tcp"
    restart: "unless-stopped"
    volumes:
      - "/docker/borealis-party/config:/config"
