# The party server's own workspace. Upstream's workspace (the Cargo.toml at the repository root) does not know about it.
#
# `src-tauri` is used as an ordinary path dependency, and the patches below make its `tauri` crates resolve to the
# webview-free stand-ins in `crates/`, so upstream's code compiles for the server without being edited.
[workspace]
resolver = "2"
members = [
  "crates/borealis-server",
  "crates/party-encounter",
  "crates/party-dice",
  "crates/party-combat",
  "crates/party-tools",
  "crates/party-mcp-bridge",
  "crates/party-sim",
  "crates/party-spells",
  "crates/tauri",
  "crates/tauri-macros",
  "crates/tauri-build",
  "crates/tauri-plugin-dialog",
  "crates/tauri-plugin-single-instance",
  "crates/tauri-plugin-updater",
]

[workspace.package]
version = "0.3.4"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.90"

# The party's own crates opt in with `[lints] workspace = true`; the stand-ins and the server keep their own settings.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[patch.crates-io]
tauri = { path = "crates/tauri" }
tauri-build = { path = "crates/tauri-build" }
tauri-plugin-dialog = { path = "crates/tauri-plugin-dialog" }
tauri-plugin-single-instance = { path = "crates/tauri-plugin-single-instance" }
tauri-plugin-updater = { path = "crates/tauri-plugin-updater" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
