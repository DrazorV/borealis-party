// Applied with `gradlew --init-script`, so upstream's Android project stays as it is.
// Gives the party app its own identity, allows plain HTTP for servers on a home network, and adds the files it opens
// (AndroidManifest.xml here).
def here = buildscript.sourceFile.parentFile

allprojects { project ->
    if (project.path != ":app") return
    project.pluginManager.withPlugin("com.android.application") {
        // Build-type resources override upstream's strings.xml in `main`, and a build-type manifest is merged over
        // upstream's (it adds intent filters; nothing of upstream's is removed).
        ["debug", "release"].each { type ->
            def set = project.android.sourceSets.getByName(type)
            set.res.srcDir(new File(here, "res"))
            set.manifest.srcFile(new File(here, "AndroidManifest.xml"))
        }
        project.androidComponents.onVariants(project.androidComponents.selector().all()) { variant ->
            variant.applicationId.set("app.borealis.party")
            variant.manifestPlaceholders.put("usesCleartextTraffic", "true")
        }
    }
}
