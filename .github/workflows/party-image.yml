name: Party image

# Builds the Borealis Connect server image from main and pushes it to ghcr.io/fortress-soft/borealis-connect.
# Tags: latest, sha-<short commit>, and the release in party/VERSION (party/release-version.sh): X.Y.Z for a full
# release, X.Y.Z.W for a server and web release, which ships only this image (party-apps.yml builds no apps for it).
# This file belongs to the fork (party/check-upstream.sh accepts .github/workflows/party-*.yml).
on:
  push:
    branches: [main]
    paths:
      - "party/**"
      - "ui/**"
      - "src-tauri/**"
      - "crates/**"
      - "content/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/party-image.yml"
  workflow_dispatch:

concurrency:
  # Per ref: a dry run on a branch never cancels main's image build.
  group: party-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/fortress-soft/borealis-connect

jobs:
  image:
    if: github.repository == 'fortress-soft/borealis-connect'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Read the party release
        id: version
        run: |
          version=$(sh party/release-version.sh)
          kind=$(sh party/release-version.sh --kind)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "::notice::image tags latest, sha-${GITHUB_SHA::7} and $version ($kind release)"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
            type=raw,value=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=Borealis Connect
            org.opencontainers.image.description=Multi-user Borealis server for Dungeon Masters and their players
            org.opencontainers.image.licenses=MIT OR Apache-2.0

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: party/docker/Dockerfile
          platforms: linux/amd64
          # Only main publishes. "Run workflow" on another branch (a next/* dry run) builds the image and shows its
          # tags without pushing anything.
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=party-image
          cache-to: type=gha,scope=party-image,mode=max
