name: Connect apps

# Builds the Borealis Connect phone and desktop apps and, for a party-v<version> tag, attaches them to that GitHub
# release, so https://github.com/fortress-soft/borealis-connect/releases/latest/download/<asset> always points at the newest
# build. The tag's version must be the one in party/Cargo.toml. Asset names carry no version (party/README.md lists
# them):
#   borealis-party-arm64.apk                signed release APK for phones
#   borealis-party-x86_64.apk               signed release APK for emulators and x86_64 Chromebooks
#   borealis-party-ios.ipa                  signed iOS app, only when the iOS signing secrets are set
#   borealis-party-ios-unsigned.ipa         unsigned iOS app for sideloading, when the iOS secrets are not set
#   borealis-party-windows-x64-setup.exe    Windows installer (NSIS, per user), unsigned
#   borealis-party-windows-x64.msi          Windows installer (MSI), unsigned; only when WiX succeeded
#   borealis-party-linux-x86_64.AppImage    Linux x86_64
#   borealis-party-linux-amd64.deb          Linux x86_64, Debian and Ubuntu
#   borealis-party-linux-aarch64.AppImage   Linux arm64; only when that build succeeded
#   borealis-party-linux-arm64.deb          Linux arm64, Debian and Ubuntu; only when that build succeeded
#   borealis-party-latest.json              the desktop apps' update feed, with a .sig per installer and AppImage
#                                           (only with the updater key, party/desktop/updates.md)
#   borealis-party-SHA256SUMS.txt
# Without the iOS secrets the iOS job builds borealis-party-ios-unsigned.ipa instead, for sideloading (AltStore,
# SideStore or Sideloadly sign it with the user's own Apple ID). iOS is optional: when its job does not run (macOS
# runners can be short), the release goes out without an iOS file.
#
# "Run workflow" on main builds everything and keeps it as workflow artifacts; run on a party-v* tag, it also
# releases. Mirrors party/android/build-apk.ps1: Tauri 2 with party/tauri.party.json and --no-default-features,
# and party/android/party.init.gradle for the app id, name and HTTP permission (installed as a Gradle init.d script,
# since Tauri can't pass Gradle --init-script).
# Secrets (repository secrets, never printed): PARTY_ANDROID_KEYSTORE_B64, PARTY_ANDROID_KEYSTORE_PASSWORD (required);
# PARTY_IOS_CERTIFICATE_P12, PARTY_IOS_CERTIFICATE_PASSWORD, PARTY_IOS_PROVISIONING_PROFILE, PARTY_APPLE_TEAM_ID
# (optional, all four or none); PARTY_UPDATER_KEY, PARTY_UPDATER_KEY_PASSWORD (optional, both or none: without them
# the desktop apps are released without an update feed). Repository variable PARTY_IOS_EXPORT_METHOD: release-testing (default, ad hoc),
# debugging or app-store-connect; it must match the provisioning profile.
# This file belongs to the fork (party/check-upstream.sh accepts .github/workflows/connect-*.yml).
on:
  push:
    tags: ["party-v*"]
  workflow_dispatch:
    inputs:
      only:
        description: "Build only these apps (a check run; a tag push always builds all)"
        type: choice
        default: all
        options: [all, ios, android, desktop]

concurrency:
  group: connect-apps-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The toolchain every job installs (dtolnay/rust-toolchain@stable, with the Android and iOS targets). Upstream's
  # rust-toolchain.toml pins its own version, which would otherwise win and has none of those targets installed;
  # Connect CI and the image (party/docker/Dockerfile) choose stable the same way.
  RUSTUP_TOOLCHAIN: stable
  NDK_VERSION: 27.2.12479018

jobs:
  version:
    if: github.repository == 'fortress-soft/borealis-connect'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the party version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' party/Cargo.toml | head -n1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$REF_TYPE" = "tag" ]; then
            if [ "$REF_NAME" != "party-v$version" ]; then
              echo "::error::tag $REF_NAME does not match party/Cargo.toml (expected party-v$version)"
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  android:
    name: Android APK (${{ matrix.abi }})
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'android' }}
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64
            rust: aarch64-linux-android
            abi: arm64
          - target: x86_64
            rust: x86_64-linux-android
            abi: x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          # The default list asks for the legacy `tools` package, which sdkmanager no longer offers.
          packages: platform-tools

      - name: Install NDK, platform, build-tools and CMake
        run: sdkmanager "ndk;$NDK_VERSION" "platforms;android-37.0" "build-tools;36.0.0" "cmake;3.22.1"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}

      # The same for Gradle's rust build task (see the iOS job).
      - name: Stable Rust for Tauri's build scripts
        run: party/ci/pin-stable-toolchain.sh

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: party-android-${{ matrix.abi }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
        working-directory: ui

      # Gradle runs every script in init.d, as `gradlew --init-script` does in build-apk.ps1. The script finds its
      # res folder next to itself, so both are copied.
      - name: Party Gradle init script
        run: |
          mkdir -p ~/.gradle/init.d
          cp party/android/party.init.gradle ~/.gradle/init.d/
          cp -R party/android/res ~/.gradle/init.d/res

      - name: Signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.PARTY_ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PARTY_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::set the repository secrets PARTY_ANDROID_KEYSTORE_B64 and PARTY_ANDROID_KEYSTORE_PASSWORD (party/README.md)"
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/party.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/party.p12" >> "$GITHUB_ENV"

      # Without upstream's default features: device-link (device-to-device transfer) and llama (on-device semantic
      # search). The characters and rules come from the server.
      - name: Build the release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PARTY_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          ANDROID_NDK: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          TARGET: ${{ matrix.target }}
        run: |
          export PATH="$ANDROID_HOME/cmake/3.22.1/bin:$PATH"
          node "$GITHUB_WORKSPACE/ui/node_modules/@tauri-apps/cli/tauri.js" android build --apk --target "$TARGET" \
            --config party/tauri.party.json --ci -- --no-default-features

      - name: Check the app id and signature
        env:
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          apk=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          [ -f "$apk" ] || { echo "::error::release APK not found at $apk"; exit 1; }
          tools="$ANDROID_HOME/build-tools/36.0.0"
          package=$("$tools/aapt2" dump packagename "$apk")
          [ "$package" = "app.borealis.party" ] \
            || { echo "::error::APK package is $package, expected app.borealis.party (init script not applied?)"; exit 1; }
          "$tools/apksigner" verify --print-certs "$apk"
          mkdir -p dist
          cp "$apk" "dist/borealis-party-$ABI.apk"
          ls -l dist

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/party.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: party-android-${{ matrix.abi }}
          path: dist/*
          if-no-files-found: error

  ios:
    name: iOS app
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'ios' }}
    needs: version
    runs-on: macos-26
    timeout-minutes: 150
    outputs:
      signed: ${{ steps.mode.outputs.signed }}
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: xcodebuild -version && xcrun --sdk iphoneos --show-sdk-version

      - name: Signed or unsigned build
        id: mode
        env:
          IOS_CERTIFICATE: ${{ secrets.PARTY_IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.PARTY_IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.PARTY_IOS_PROVISIONING_PROFILE }}
          TEAM_ID: ${{ secrets.PARTY_APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          count=0
          for v in IOS_CERTIFICATE IOS_CERTIFICATE_PASSWORD IOS_MOBILE_PROVISION TEAM_ID; do
            [ -z "${!v}" ] || count=$((count + 1))
          done
          if [ "$count" -eq 4 ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "rust=aarch64-apple-ios" >> "$GITHUB_OUTPUT"
          elif [ "$count" -eq 0 ]; then
            echo "::notice::no iOS signing secrets: building an unsigned IPA for sideloading (borealis-party-ios-unsigned.ipa)"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "rust=aarch64-apple-ios" >> "$GITHUB_OUTPUT"
          else
            echo "::error::set all four iOS signing secrets or none (party/README.md)"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ steps.mode.outputs.rust }}

      # Tauri's iOS build runs cargo inside Xcode's "Build Rust Code" phase with only the TAURI*, WRY*, CARGO_*,
      # RUST_*, PATH and TMPDIR variables (tauri-cli mobile/mod.rs env_vars), so RUSTUP_TOOLCHAIN never reaches it and
      # upstream's rust-toolchain.toml pin would win there (0.3.2's first iOS run failed downloading that pin). A
      # rustup directory override beats the toolchain file and lives in ~/.rustup, not in the checkout; the check
      # runs without RUSTUP_TOOLCHAIN, from where Xcode's phase runs cargo.
      - name: Stable Rust for Tauri's build scripts
        run: party/ci/pin-stable-toolchain.sh

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: party-ios-${{ steps.mode.outputs.signed }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
        working-directory: ui

      # The party front end (party/tauri.party.json), the party app's own identity and version (the IPA's
      # CFBundleShortVersionString is the party version, not Borealis's), as on Android and the desktop, and
      # party/tauri.party.ios.json on top when the fork has one.
      - name: Party config
        env:
          TEAM_ID: ${{ secrets.PARTY_APPLE_TEAM_ID }}
          RUN_NUMBER: ${{ github.run_number }}
          PARTY_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$PARTY_VERSION"
          # productName stays "Borealis Party" after the rename to Borealis Connect: the Xcode project and the app bundle are
          # named after it. The home screen shows CFBundleDisplayName (party/ios/Info.plist), "Borealis Connect".
          identity=$(jq -n --arg build "$RUN_NUMBER" --arg team "$TEAM_ID" --arg version "$PARTY_VERSION" '
            {productName: "Borealis Party", identifier: "app.borealis.party", version: $version,
             bundle: {iOS: ({bundleVersion: $build} + (if $team == "" then {} else {developmentTeam: $team} end))}}')
          printf '%s' "$identity" > "$RUNNER_TEMP/identity.json"
          files=(party/tauri.party.json "$RUNNER_TEMP/identity.json")
          [ ! -f party/tauri.party.ios.json ] || files+=(party/tauri.party.ios.json)
          jq -s 'reduce .[] as $c ({}; . * $c)' "${files[@]}" > "$RUNNER_TEMP/party.ios.json"
          jq . "$RUNNER_TEMP/party.ios.json"

      # Tauri imports the certificate and profile from IOS_CERTIFICATE* and IOS_MOBILE_PROVISION into its own
      # temporary keychain and signs manually.
      - name: Build the signed IPA
        if: steps.mode.outputs.signed == 'true'
        env:
          IOS_CERTIFICATE: ${{ secrets.PARTY_IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.PARTY_IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.PARTY_IOS_PROVISIONING_PROFILE }}
          EXPORT_METHOD: ${{ vars.PARTY_IOS_EXPORT_METHOD || 'release-testing' }}
        run: |
          set -euo pipefail
          node ui/node_modules/@tauri-apps/cli/tauri.js ios build --target aarch64 --export-method "$EXPORT_METHOD" \
            --config "$RUNNER_TEMP/party.ios.json" --ci -- --no-default-features
          ipa=$(find src-tauri/gen/apple/build -name '*.ipa' -type f | head -n 1)
          [ -n "$ipa" ] || { echo "::error::no .ipa under src-tauri/gen/apple/build"; exit 1; }
          check="$RUNNER_TEMP/ipa-check"
          mkdir -p "$check"
          unzip -q "$ipa" -d "$check"
          app=$(find "$check/Payload" -maxdepth 1 -name '*.app' | head -n 1)
          bundle_id=$(plutil -extract CFBundleIdentifier raw "$app/Info.plist")
          [ "$bundle_id" = "app.borealis.party" ] || { echo "::error::IPA bundle id $bundle_id, expected app.borealis.party"; exit 1; }
          [ -f "$app/embedded.mobileprovision" ] || { echo "::error::the IPA has no provisioning profile"; exit 1; }
          codesign --verify --deep --strict "$app"
          mkdir -p dist
          cp "$ipa" dist/borealis-party-ios.ipa
          ls -l dist

      # Without Apple secrets: an unsigned iPhone build. Sideloading tools (AltStore, SideStore, Sideloadly) sign it
      # with the user's own Apple ID when they install it (party/README.md, "Download the apps").
      - name: Build the unsigned IPA (for sideloading)
        if: steps.mode.outputs.signed != 'true'
        run: |
          set -euo pipefail
          node ui/node_modules/@tauri-apps/cli/tauri.js ios build --target aarch64 --no-sign             --config "$RUNNER_TEMP/party.ios.json" --ci -- --no-default-features
          ipa=$(find src-tauri/gen/apple/build -name '*.ipa' -type f | head -n 1)
          [ -n "$ipa" ] || { echo "::error::no .ipa under src-tauri/gen/apple/build"; exit 1; }
          check="$RUNNER_TEMP/ipa-check"
          mkdir -p "$check"
          unzip -q "$ipa" -d "$check"
          app=$(find "$check/Payload" -maxdepth 1 -name '*.app' | head -n 1)
          [ -n "$app" ] || { echo "::error::the IPA has no Payload/*.app"; exit 1; }
          bundle_id=$(plutil -extract CFBundleIdentifier raw "$app/Info.plist")
          [ "$bundle_id" = "app.borealis.party" ] || { echo "::error::IPA bundle id $bundle_id, expected app.borealis.party"; exit 1; }
          platform=$(plutil -extract CFBundleSupportedPlatforms.0 raw "$app/Info.plist")
          [ "$platform" = "iPhoneOS" ] || { echo "::error::the IPA is for $platform, not iPhoneOS"; exit 1; }
          mkdir -p dist
          cp "$ipa" dist/borealis-party-ios-unsigned.ipa
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.mode.outputs.signed == 'true' && 'party-ios' || 'party-ios-unsigned' }}
          path: dist/*
          if-no-files-found: error

  # Mirrors party/desktop/build-desktop.ps1 -Installer: the party config, its own cargo target folder and
  # --no-default-features. The identifier app.borealis.party keeps its data apart from desktop Borealis
  # (%APPDATA%\app.borealis.party, ~/.local/share/app.borealis.party). Unsigned. Linux arm64 is optional: if it fails,
  # the release goes out without it.
  # With the updater key the Windows installer and the AppImages are signed for the party feed (.sig beside each).
  desktop:
    name: Desktop (${{ matrix.name }})
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'desktop' }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    continue-on-error: ${{ matrix.optional }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.PARTY_UPDATER_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.PARTY_UPDATER_KEY_PASSWORD }}
      PARTY_VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            optional: false
          # 22.04: the oldest glibc on the runners, so the AppImage starts on more distributions.
          - name: linux-x86_64
            os: ubuntu-22.04
            deb: amd64
            optional: false
          - name: linux-aarch64
            os: ubuntu-22.04-arm
            deb: arm64
            optional: true
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings and long paths (Windows)
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - uses: actions/checkout@v4

      - name: Linux webkit2gtk deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev

      # Its own cargo target folder, as build-desktop.ps1, so it is never taken for a desktop Borealis build.
      - name: Party target folder
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then root=$(pwd -W); else root=$PWD; fi
          echo "CARGO_TARGET_DIR=$root/target/party-desktop" >> "$GITHUB_ENV"

      # As build-desktop.ps1: the party version (the updater compares it with the feed's), and signed update files
      # when the key is there.
      - name: Party version and updater config
        run: |
          set -euo pipefail
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then updater=true; else updater=false; echo "::notice::no PARTY_UPDATER_KEY: no update feed"; fi
          if [ "$RUNNER_OS" = "Windows" ]; then out=$(cygpath -m "$RUNNER_TEMP")/party-desktop-build.json; else out=$RUNNER_TEMP/party-desktop-build.json; fi
          printf '{"version":"%s","bundle":{"createUpdaterArtifacts":%s}}\n' "$PARTY_VERSION" "$updater" > "$out"
          cat "$out"
          echo "PARTY_BUILD_CONFIG=$out" >> "$GITHUB_ENV"
          echo "PARTY_UPDATER=$updater" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/party-desktop"
          shared-key: party-desktop-${{ matrix.name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
        working-directory: ui

      # Without upstream's default features: device-link and llama, as on Android. On Linux,
      # party/tauri.party.linux.json leaves out upstream's MIME file, which desktop Borealis's package owns.
      - name: Build the installer
        run: |
          set -euo pipefail
          configs=(--config party/tauri.party.json --config party/tauri.party.desktop.json --config "$PARTY_BUILD_CONFIG")
          if [ "$RUNNER_OS" = "Windows" ]; then
            bundles=nsis
          else
            bundles=deb,appimage
            configs+=(--config party/tauri.party.linux.json)
          fi
          node ui/node_modules/@tauri-apps/cli/tauri.js build "${configs[@]}" --bundles "$bundles" --ci \
            -- --no-default-features

      # The MSI is extra: the release goes out without it if WiX fails. Cargo has nothing left to compile.
      - name: Build the MSI (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          node ui/node_modules/@tauri-apps/cli/tauri.js build --config party/tauri.party.json \
            --config party/tauri.party.desktop.json --config "$PARTY_BUILD_CONFIG" --bundles msi --ci -- --no-default-features

      - name: Check and rename
        env:
          NAME: ${{ matrix.name }}
          DEB_ARCH: ${{ matrix.deb }}
        run: |
          set -euo pipefail
          bundle="$CARGO_TARGET_DIR/release/bundle"
          one() {
            local found
            found=$(find "$bundle/$1" -maxdepth 1 -type f -name "$2")
            [ "$(printf '%s\n' "$found" | grep -c .)" = 1 ] || { echo "::error::expected one $2 in $bundle/$1: $found"; exit 1; }
            printf '%s' "$found"
          }
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$(one nsis '*-setup.exe')" "dist/borealis-party-$NAME-setup.exe"
            if [ "$PARTY_UPDATER" = true ]; then cp "$(one nsis '*-setup.exe.sig')" "dist/borealis-party-$NAME-setup.exe.sig"; fi
            if [ -d "$bundle/msi" ]; then cp "$(one msi '*.msi')" "dist/borealis-party-$NAME.msi"; fi
          else
            deb=$(one deb '*.deb')
            dpkg-deb -f "$deb" Package Version Architecture
            [ "$(dpkg-deb -f "$deb" Architecture)" = "$DEB_ARCH" ] || { echo "::error::deb is not $DEB_ARCH"; exit 1; }
            if dpkg-deb -c "$deb" | grep -q 'usr/share/mime/packages/borealis.xml'; then
              echo "::error::the deb carries desktop Borealis's MIME file"
              exit 1
            fi
            cp "$deb" "dist/borealis-party-linux-$DEB_ARCH.deb"
            cp "$(one appimage '*.AppImage')" "dist/borealis-party-$NAME.AppImage"
            if [ "$PARTY_UPDATER" = true ]; then cp "$(one appimage '*.AppImage.sig')" "dist/borealis-party-$NAME.AppImage.sig"; fi
          fi
          ls -l dist

      # .borealis opens with the app (party/tauri.party.desktop.json): the installer registers it with the app's icon
      # and uninstalling removes it; the MSI's tables name it; the Linux packages carry its MIME type and claim it in
      # the desktop entry. .dnd5e stays desktop Borealis's.
      - name: Check the .borealis file type (Windows)
        if: runner.os == 'Windows'
        # Windows PowerShell 5.1, as tried by hand: PowerShell 7 hands the MSI's COM calls arguments it refuses.
        shell: powershell
        env:
          NAME: ${{ matrix.name }}
        run: |
          $msi = "dist/borealis-party-$env:NAME.msi"
          $extra = if (Test-Path $msi) { @{ Msi = $msi } } else { @{} }
          ./party/desktop/check-file-type.ps1 -Setup "dist/borealis-party-$env:NAME-setup.exe" @extra

      - name: Check the .borealis file type (Linux)
        if: runner.os == 'Linux'
        env:
          DEB_ARCH: ${{ matrix.deb }}
        run: |
          set -euo pipefail
          deb="dist/borealis-party-linux-$DEB_ARCH.deb"
          x=$(mktemp -d)
          dpkg-deb -x "$deb" "$x"
          mime="$x/usr/share/mime/packages/borealis-party.xml"
          [ -f "$mime" ] || { echo "::error::the deb has no borealis-party.xml MIME file"; exit 1; }
          if ! grep -q 'type="application/x-borealis-bundle"' "$mime" || ! grep -q 'pattern="\*.borealis"' "$mime"; then
            echo "::error::borealis-party.xml does not define *.borealis"; exit 1
          fi
          if grep -Eq 'pattern="[^"]*dnd5e"|type="application/x-dnd5e"' "$mime"; then
            echo "::error::borealis-party.xml claims .dnd5e"; exit 1
          fi
          desktop=$(find "$x/usr/share/applications" -name '*.desktop' | head -n 1)
          cat "$desktop"
          if ! grep -q '^MimeType=application/x-borealis-bundle;\?$' "$desktop"; then
            echo "::error::the desktop entry does not claim application/x-borealis-bundle"; exit 1
          fi
          grep -q '^Exec=.* %F$' "$desktop" || { echo "::error::the desktop entry does not pass files (%F)"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: party-desktop-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [version, android, ios, desktop]
    # iOS is optional: macOS runners can be short, and without Apple secrets the IPA is only for sideloading. The
    # release goes out without it rather than not at all; Android and desktop must have built.
    if: ${{ !cancelled() && needs.version.outputs.release == 'true' && needs.android.result == 'success' && needs.desktop.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.version.outputs.version }}
      SIGNED_IOS: ${{ needs.ios.outputs.signed }}
      IOS_BUILT: ${{ needs.ios.result == 'success' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: party-android-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: party-desktop-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        if: needs.ios.result == 'success'
        with:
          path: assets
          pattern: party-ios*
          merge-multiple: true

      - uses: actions/checkout@v4
        with:
          path: source
          sparse-checkout: party/desktop

      # The desktop apps' update feed, when their files were signed (party/desktop/updates.md).
      - name: Update feed
        run: |
          set -euo pipefail
          if ls assets/*.sig >/dev/null 2>&1; then
            python3 source/party/desktop/update-feed.py assets "$VERSION" "$TAG"
          else
            echo "::notice::no signed desktop files: released without an update feed"
          fi

      - name: Check names and write checksums
        working-directory: assets
        run: |
          set -euo pipefail
          # Linux arm64 and the MSI are optional and released when they built.
          expected="borealis-party-arm64.apk borealis-party-x86_64.apk borealis-party-windows-x64-setup.exe"
          expected="$expected borealis-party-linux-x86_64.AppImage borealis-party-linux-amd64.deb"
          if [ "$IOS_BUILT" = "true" ]; then
            if [ "$SIGNED_IOS" = "true" ]; then expected="$expected borealis-party-ios.ipa"
            else expected="$expected borealis-party-ios-unsigned.ipa"; fi
          fi
          for f in $expected; do
            [ -f "$f" ] || { echo "::error::missing asset $f"; ls -l; exit 1; }
          done
          sha256sum -- * | LC_ALL=C sort -k2 > borealis-party-SHA256SUMS.txt
          cat borealis-party-SHA256SUMS.txt

      - name: Create or update the release
        run: |
          set -euo pipefail
          if [ "$IOS_BUILT" != "true" ]; then ios="no iOS app (the iOS build did not run)"
          elif [ "$SIGNED_IOS" = "true" ]; then ios="the iOS app"
          else ios="an unsigned iOS app to sideload with AltStore, SideStore or Sideloadly"; fi
          # A release is published (and marked latest) only once its files are on it: the desktop apps read their
          # update feed from releases/latest, which answers 404 for a latest release without files. Make the release
          # with its notes as a draft (gh release create --draft); a missing one is created as a draft here.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "Borealis Connect $VERSION" \
              --notes "Borealis Connect $VERSION (built on Borealis): the Android app (arm64 for phones, x86_64 for emulators), the Windows and Linux apps (unsigned), and $ios. Verify downloads against borealis-party-SHA256SUMS.txt."
          fi
          gh release upload "$TAG" assets/* --clobber
          gh release edit "$TAG" --draft=false --latest
