[package]
name = "borealis-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Multi-user Borealis server: Dungeon Master and player accounts, groups, shared content"

[[bin]]
name = "borealis-server"
path = "src/main.rs"

[dependencies]
borealis = { path = "../../src-tauri", default-features = false, features = ["headless"] }
tauri-headless = { path = "../tauri-headless" }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "fs", "set-header", "trace"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
rusqlite = { version = "0.37", features = ["bundled"] }
argon2 = "0.5"
sha2 = "0.10"
rand = "0.9"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive", "env"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile = "3"
base64 = "0.22"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
